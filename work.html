<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Samples — GIDIGBA STUDIOS</title>
<meta name="description" content="Before and after samples from GIDIGBA STUDIOS. Choose women or men to see every finished look beside the original photo." />
<meta name="theme-color" content="#C0F500" />
<link rel="icon" href="images/favicon-96.png" sizes="96x96" type="image/png" />
<link rel="apple-touch-icon" href="images/logo-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="styles.css" />
<script src="galleries.js" defer></script>
<script src="script.js" defer></script>
</head>
<body>
<div id="chrome-top"></div>

<main>
  <section class="page-hero section-tight">
    <div class="container">
      <span class="eyebrow">Samples</span>
      <h1 class="page-hero-title">Every finished look,<br>beside the photo it came from.</h1>
      <p class="page-hero-sub">Pick who you want to see. Each page opens with the original photo, then every finished image made from it.</p>
    </div>
  </section>

  <section class="section sample-choice">
    <div class="container">
      <div class="choice-grid">
        <a class="choice-card" href="samples-female.html">
          <span class="cc-preview">
            <img src="images/f-gold-before.webp" alt="" loading="eager" />
            <img src="images/f-gold.webp" alt="Female sample — finished look" loading="eager" />
          </span>
          <span class="cc-body">
            <span class="cc-title">Women</span>
            <span class="cc-sub">Every female finished look</span>
          </span>
        </a>
        <a class="choice-card" href="samples-male.html">
          <span class="cc-preview">
            <img src="images/m-red-before.webp" alt="" loading="eager" />
            <img src="images/m-red.webp" alt="Male sample — finished look" loading="eager" />
          </span>
          <span class="cc-body">
            <span class="cc-title">Men</span>
            <span class="cc-sub">Every male finished look</span>
          </span>
        </a>
      </div>
    </div>
  </section>
</main>

<div id="chrome-bottom"></div>
</body>
</html>
