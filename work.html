<body data-src="theirs" data-page="samples" data-title="Work | GIDIGBA STUDIOS" data-desc="Real transformations delivered within 24 business hours.">
<div id="chrome-top"></div>
<main id="main">
  

  <section class="page-hero">
    <div class="container">
      <span class="eyebrow" style="background:var(--lime);color:#000">Proof of work</span>
      <h1>Real transformations.<br>Delivered in 24 hours.</h1>
    </div>
  </section>


  <section class="section">
    <div class="container">
      <div class="sample-picker">

        <a class="sample-choice" href="/samples-female">
          <span class="sc-frame">
            <img src="images/samples/f-01.webp" alt="Client finished in a beaded gold gown" loading="eager" decoding="async" />
          </span>
          <span class="sc-name">Female</span>
        </a>

        <a class="sample-choice" href="/samples-male">
          <span class="sc-frame">
            <img src="images/samples/m-01.webp" alt="Client in a light blue shirt" loading="eager" decoding="async" />
          </span>
          <span class="sc-name">Male</span>
        </a>

        <a class="sample-choice" href="/samples-child">
          <span class="sc-frame">
            <img src="images/samples/c-01.webp" alt="Child in a denim jacket and star jeans" loading="eager" decoding="async" />
          </span>
          <span class="sc-name">Child</span>
        </a>

        <a class="sample-choice" href="/samples-couple">
          <span class="sc-frame">
            <img src="images/samples/cp-02.webp" alt="Couple portrait, green velvet and orange silk" loading="eager" decoding="async" />
          </span>
          <span class="sc-name">Couple</span>
        </a>

      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="work-grid">
        <figure class="work-item reveal">
          <img src="images/samples/f-05.webp" alt="Client work — white corset and brown skirt" loading="eager" decoding="async" />
        </figure>
        <figure class="work-item reveal">
          <img src="images/samples/f-07.webp" alt="Client work — beaded fringe dress" loading="eager" decoding="async" />
        </figure>
        <figure class="work-item reveal">
          <img src="images/samples/f-11.webp" alt="Client work — blue kente and gold headwrap" loading="eager" decoding="async" />
        </figure>
        <figure class="work-item reveal">
          <img src="images/samples/m-04.webp" alt="Client work — seated portrait in black" loading="eager" decoding="async" />
        </figure>
        <figure class="work-item reveal">
          <img src="images/samples/m-02.webp" alt="Client work — teal knit" loading="eager" decoding="async" />
        </figure>
        <figure class="work-item reveal">
          <img src="images/samples/f-10.webp" alt="Client work — gold lace gown at dusk" loading="eager" decoding="async" />
        </figure>
      </div>
      <p class="sample-note">Software-assisted images. Minor variations from real life may occur.</p>
    </div>
  </section>

  <section class="cta-band">
    <div class="container reveal">
      <h2 class="serif">Want results like these?</h2>
      <a href="/photoshoots" class="btn btn-primary">Start Photoshoot</a>
    </div>
  </section>
