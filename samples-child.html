<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <title>Children's Work Samples | GIDIGBA STUDIOS</title>
  <meta name="description" content="Before and after work samples for children, from GIDIGBA STUDIOS." />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="js/chrome.js" defer></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-title="Children's Work Samples | GIDIGBA STUDIOS" data-desc="Before and after work samples for children." data-page="samples">
<div id="chrome-top"></div>
<main id="main">

  <section class="page-hero">
    <div class="container">
      <a class="smp-back" href="samples.html">&larr; All samples</a>
      <span class="eyebrow">Children</span>
      <h1>One photo, five finished images.</h1>
    </div>
  </section>

  <section class="section section-tight">
    <div class="container">
      <div class="ba-panel">

        <div class="ba-before">
          <span class="ba-tag">Before</span>
          <figure class="ba-figure">
            <img src="images/c-before.webp" alt="The photo the parent sent, taken at home" />
            <figcaption>The photo her parent sent us</figcaption>
          </figure>
        </div>

        <div class="ba-after">
          <span class="ba-tag ba-tag-lime">After</span>
          <div class="swipe-rail ba-rail" id="afterRail">
            <figure class="ba-figure">
              <img src="images/samples/c-01.webp" alt="Denim jacket and jeans with stars" loading="lazy" />
              <figcaption>Denim and stars</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/c-02.webp" alt="Pink bubble dress, star wall" loading="lazy" />
              <figcaption>Pink bubble dress</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/c-03.webp" alt="White tiered dress, teal fabric" loading="lazy" />
              <figcaption>White tiered dress</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/c-04.webp" alt="Black dress with gold fringed sleeves" loading="lazy" />
              <figcaption>Black and gold</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/c-05.webp" alt="White halter trouser set, seated on a block" loading="lazy" />
              <figcaption>White trouser set</figcaption>
            </figure>
          </div>
        </div>

      </div>
      <p class="sample-note">Software-assisted images. Minor variations from real life may occur.</p>
    </div>
  </section>

  <section class="cta-band">
    <div class="container reveal">
      <h2 class="serif">Want your own?</h2>
      <a href="photoshoots.html" class="btn btn-primary">Start Photoshoot</a>
    </div>
  </section>

</main>
<div id="chrome-bottom"></div>
<script src="js/app.js" defer></script>
<script src="js/swipe.js"></script>
<script src="js/legacy-shim.js" defer></script>
</body>
</html>
