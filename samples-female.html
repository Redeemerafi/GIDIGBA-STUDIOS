<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <title>Women's Samples | GIDIGBA STUDIOS</title>
  <meta name="description" content="Every female sample: the original photo first, then all finished images made from it." />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="js/chrome.js" defer></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-title="Women's Samples | GIDIGBA STUDIOS" data-desc="Every female sample: the original photo first, then all finished images made from it." data-page="samples">
<div id="chrome-top"></div>
<main id="main">

  <section class="page-hero">
    <div class="container">
      <a class="smp-back" href="samples.html">&larr; All samples</a>
      <span class="eyebrow">Women</span>
      <h1>One photo, twelve finished images.</h1>
    </div>
  </section>

  <section class="section section-tight">
    <div class="container">
      <div class="ba-panel">

        <div class="ba-before">
          <span class="ba-tag">Before</span>
          <figure class="ba-figure">
            <img src="images/f-before.webp" alt="The photo the client sent, a plain phone portrait in a white dress" />
            <figcaption>The photo she sent us</figcaption>
          </figure>
        </div>

        <div class="ba-after">
          <span class="ba-tag ba-tag-lime">After</span>
          <div class="swipe-rail ba-rail" id="afterRail">
            <figure class="ba-figure">
              <img src="images/samples/f-01.webp" alt="Beaded gold gown" loading="lazy" />
              <figcaption>Beaded gold gown</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-02.webp" alt="White jumpsuit, studio" loading="lazy" />
              <figcaption>White jumpsuit, studio</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-03.webp" alt="Gold headdress, lace" loading="lazy" />
              <figcaption>Gold headdress, lace</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-04.webp" alt="Denim and cake" loading="lazy" />
              <figcaption>Denim and cake</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-05.webp" alt="Blue beach set" loading="lazy" />
              <figcaption>Blue beach set</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-06.webp" alt="Brown corset dress" loading="lazy" />
              <figcaption>Brown corset dress</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-07.webp" alt="Bronze beaded mini" loading="lazy" />
              <figcaption>Bronze beaded mini</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-08.webp" alt="Silver fringe mini" loading="lazy" />
              <figcaption>Silver fringe mini</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-09.webp" alt="Silver fringe, full length" loading="lazy" />
              <figcaption>Silver fringe, full length</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-10.webp" alt="Floral high neck" loading="lazy" />
              <figcaption>Floral high neck</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-11.webp" alt="Gold beads and white" loading="lazy" />
              <figcaption>Gold beads and white</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-12.webp" alt="Kente wrap" loading="lazy" />
              <figcaption>Kente wrap</figcaption>
            </figure>
          </div>
        </div>

      </div>
    </div>
  </section>

</main>
<div class="modal-overlay" id="bookingModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Book</h2>
        <button class="modal-close" onclick="closeBooking()" aria-label="Close">✕</button>
      </div>
      <div class="progress-bar"><span id="progressBar" style="width:0%"></span></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

<div id="chrome-bottom"></div>
  <script src="js/galleries.js"></script>
  <script src="js/swipe.js"></script>
<script src="js/app.js" defer></script>
<script src="js/legacy-shim.js" defer></script>
</body>
</html>
