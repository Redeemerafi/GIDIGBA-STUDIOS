<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <title>Women's Samples | GIDIGBA STUDIOS</title>
  <meta name="description" content="Every female sample: the original photo first, then all finished images made from it." />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="js/chrome.js" defer></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-title="Women's Samples | GIDIGBA STUDIOS" data-desc="Every female sample: the original photo first, then all finished images made from it." data-page="samples">
<div id="chrome-top"></div>
<main id="main">

  <section class="page-hero">
    <div class="container">
      <a class="smp-back" href="samples.html">&larr; All samples</a>
      <span class="eyebrow">Women</span>
      <h1>The original photo, and every look made from it.</h1>
    </div>
  </section>

  <section class="section section-tight">
    <div class="container">
      <div class="ba-panel">

        <div class="ba-before">
          <span class="ba-tag">Before</span>
          <figure class="ba-figure">
            <img src="images/f-gold-before.webp" alt="The photo the client sent, taken on a phone" />
            <figcaption>The photo she sent us</figcaption>
          </figure>
        </div>

        <div class="ba-after">
          <span class="ba-tag ba-tag-lime">After</span>
          <div class="swipe-rail ba-rail" id="afterRail">
            <figure class="ba-figure">
              <img src="images/f-gold.webp" alt="The same photo, finished in the studio" loading="lazy" />
              <figcaption>Same photo, finished</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/f-white.webp" alt="White lace look" loading="lazy" />
              <figcaption>White lace</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/f-kente.webp" alt="Kente look" loading="lazy" />
              <figcaption>Kente</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/f-night1.webp" alt="Evening studio light" loading="lazy" />
              <figcaption>Evening light</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/f-night2.webp" alt="Evening warm glow" loading="lazy" />
              <figcaption>Warm glow</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/f-floral.webp" alt="Floral daylight" loading="lazy" />
              <figcaption>Floral</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/f-lace.webp" alt="Lace editorial" loading="lazy" />
              <figcaption>Lace</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/f-pepper.webp" alt="Pepper look" loading="lazy" />
              <figcaption>Pepper</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/f-bikini.webp" alt="Bikini look" loading="lazy" />
              <figcaption>Bikini</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/f-cake.webp" alt="Birthday cake look" loading="lazy" />
              <figcaption>Birthday cake</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/m-rose.webp" alt="Rose look" loading="lazy" />
              <figcaption>Rose</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/m-teal.webp" alt="Teal look" loading="lazy" />
              <figcaption>Teal</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/m-match.webp" alt="Matching set look" loading="lazy" />
              <figcaption>Matching set</figcaption>
            </figure>
          </div>
        </div>

      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <h2 class="smp-h">More finished looks</h2>
      <div class="smp-grid">
        <figure class="smp-item">
          <img src="images/f-white.webp" alt="Resort · white lace" loading="lazy" />
          <figcaption>Resort · white lace</figcaption>
        </figure>
        <figure class="smp-item">
          <img src="images/f-kente.webp" alt="Kente · celebration" loading="lazy" />
          <figcaption>Kente · celebration</figcaption>
        </figure>
        <figure class="smp-item">
          <img src="images/f-night1.webp" alt="Evening · studio light" loading="lazy" />
          <figcaption>Evening · studio light</figcaption>
        </figure>
        <figure class="smp-item">
          <img src="images/f-night2.webp" alt="Evening · warm glow" loading="lazy" />
          <figcaption>Evening · warm glow</figcaption>
        </figure>
        <figure class="smp-item">
          <img src="images/f-floral.webp" alt="Floral · soft daylight" loading="lazy" />
          <figcaption>Floral · soft daylight</figcaption>
        </figure>
        <figure class="smp-item">
          <img src="images/f-lace.webp" alt="Lace · editorial" loading="lazy" />
          <figcaption>Lace · editorial</figcaption>
        </figure>
        <figure class="smp-item">
          <img src="images/f-pepper.webp" alt="Editorial · colour block" loading="lazy" />
          <figcaption>Editorial · colour block</figcaption>
        </figure>
        <figure class="smp-item">
          <img src="images/f-bikini.webp" alt="Resort · poolside" loading="lazy" />
          <figcaption>Resort · poolside</figcaption>
        </figure>
        <figure class="smp-item">
          <img src="images/f-cake.webp" alt="Celebration · cake" loading="lazy" />
          <figcaption>Celebration · cake</figcaption>
        </figure>
        <figure class="smp-item">
          <img src="images/m-rose.webp" alt="Editorial · rose" loading="lazy" />
          <figcaption>Editorial · rose</figcaption>
        </figure>
        <figure class="smp-item">
          <img src="images/m-teal.webp" alt="Poolside · teal" loading="lazy" />
          <figcaption>Poolside · teal</figcaption>
        </figure>
        <figure class="smp-item">
          <img src="images/m-match.webp" alt="Brand · matching set" loading="lazy" />
          <figcaption>Brand · matching set</figcaption>
        </figure>
      </div>
      <p class="sample-note">Software-assisted images. Minor variations from real life may occur.</p>
    </div>
  </section>

</main>
<div class="modal-overlay" id="bookingModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Book</h2>
        <button class="modal-close" onclick="closeBooking()" aria-label="Close">✕</button>
      </div>
      <div class="progress-bar"><span id="progressBar" style="width:0%"></span></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

<div id="chrome-bottom"></div>
  <script src="js/galleries.js"></script>
  <script src="js/swipe.js"></script>
<script src="js/app.js" defer></script>
<script src="js/legacy-shim.js" defer></script>
</body>
</html>
