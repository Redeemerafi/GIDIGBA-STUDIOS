<html lang="en" class="no-js">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

       so these have to be in the HTML itself or the link arrives with no picture -->

  <meta property="og:image" content="https://gidigba-studios.vercel.app/images/og/female.jpg" />
  <meta property="og:image:secure_url" content="https://gidigba-studios.vercel.app/images/og/female.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

<body data-title="Women's Samples | GIDIGBA STUDIOS" data-desc="Every female sample: the original photo first, then all finished images made from it." data-page="samples">
<div id="chrome-top"></div>
<main id="main">

  <section class="page-hero">
    <div class="container">
      <a class="smp-back" href="samples.html">&larr; All samples</a>
      <span class="eyebrow">Women</span>
      <h1>One photo, twelve finished images.</h1>
    </div>
  </section>

  <section class="section section-tight">
    <div class="container">
      <div class="ba-panel">

        <div class="ba-before">
          <span class="ba-tag">Before</span>
          <figure class="ba-figure">
            <img src="images/f-before.webp" alt="The photo the client sent, a plain phone portrait in a white dress" />
            <figcaption>The photo she sent us</figcaption>
          </figure>
        </div>

        <div class="ba-after">
          <span class="ba-tag ba-tag-lime">After</span>
          <div class="swipe-rail ba-rail" id="afterRail">
            <figure class="ba-figure">
              <img src="images/samples/f-01.webp" alt="Beaded gold gown" loading="eager" decoding="async" />
              <figcaption>Beaded gold gown</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-02.webp" alt="White jumpsuit, studio" loading="eager" decoding="async" />
              <figcaption>White jumpsuit, studio</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-03.webp" alt="Gold headdress, lace" loading="eager" decoding="async" />
              <figcaption>Gold headdress, lace</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-04.webp" alt="Denim and cake" loading="eager" decoding="async" />
              <figcaption>Denim and cake</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-05.webp" alt="Blue beach set" loading="eager" decoding="async" />
              <figcaption>Blue beach set</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-06.webp" alt="Brown corset dress" loading="eager" decoding="async" />
              <figcaption>Brown corset dress</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-07.webp" alt="Bronze beaded mini" loading="eager" decoding="async" />
              <figcaption>Bronze beaded mini</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-08.webp" alt="Silver fringe mini" loading="eager" decoding="async" />
              <figcaption>Silver fringe mini</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-09.webp" alt="Silver fringe, full length" loading="eager" decoding="async" />
              <figcaption>Silver fringe, full length</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-10.webp" alt="Floral high neck" loading="eager" decoding="async" />
              <figcaption>Floral high neck</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-11.webp" alt="Gold beads and white" loading="eager" decoding="async" />
              <figcaption>Gold beads and white</figcaption>
            </figure>
            <figure class="ba-figure">
              <img src="images/samples/f-12.webp" alt="Kente wrap" loading="eager" decoding="async" />
              <figcaption>Kente wrap</figcaption>
            </figure>
          </div>
        </div>

      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <h2 class="smp-h">More women's work</h2>
      <div class="duo-grid">
        <figure class="smp-item">
          <img src="images/samples/w-01.webp" alt="Platinum hair, denim and gold bangles" loading="eager" decoding="async" />
          <figcaption>Platinum hair, denim</figcaption>
        </figure>
        <figure class="smp-item">
          <img src="images/samples/w-02.webp" alt="Maternity portrait in black" loading="eager" decoding="async" />
          <figcaption>Maternity</figcaption>
        </figure>
        <figure class="smp-item">
          <img src="images/samples/w-03.webp" alt="Coral beads and red velvet" loading="eager" decoding="async" />
          <figcaption>Coral beads and velvet</figcaption>
        </figure>
        <figure class="smp-item">
          <img src="images/samples/w-04.webp" alt="Black fur jacket, studio" loading="eager" decoding="async" />
          <figcaption>Black fur, studio</figcaption>
        </figure>
      </div>
      <p class="sample-note">Different clients from the set above.</p>
    </div>
  </section>

</main>
<div class="modal-overlay" id="bookingModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Book</h2>
        <button class="modal-close" onclick="closeBooking()" aria-label="Close">✕</button>
      </div>
      <div class="progress-bar"><span id="progressBar" style="width:0%"></span></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

<div id="chrome-bottom"></div>
  <script src="js/galleries.js"></script>
  <script src="js/swipe.js"></script>
<script src="js/db-config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js" defer></script>
<script src="js/legacy-shim.js" defer></script>
</body>
</html>
