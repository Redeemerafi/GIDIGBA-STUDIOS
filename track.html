<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <title>Track Your Order | GIDIGBA STUDIOS</title>
  <meta name="description" content="Check the status of your booking from this device, without an account." />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="js/chrome.js" defer></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-title="Track Your Order | GIDIGBA STUDIOS" data-desc="Check the status of your booking from this device, without an account." data-page="track">
<div id="chrome-top"></div>
<main id="main">


<div class="page-body">

<section class="page-hero">
  <div class="container">
    <span class="eyebrow reveal">Order Status · 100% Online</span>
    <h1 class="reveal">Where's my <span class="hl">photoshoot</span>?</h1>
    <p class="reveal">This tracker reads your booking from this device — drafts, submissions and delivery status, without needing an account.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="track-shell">
      <div id="trackResult"></div>
      <p class="gallery-caption" style="text-align:center; margin-top:22px;">
        Booked from a different phone or browser? Ask us directly on WhatsApp —
        <a href="https://wa.me/233534317611" target="_blank" rel="noopener" class="inline-link">+233 53 431 7611</a>.
      </p>
    </div>
  </div>
</section>

</div>


</main>
<div class="modal-overlay" id="bookingModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Book</h2>
        <button class="modal-close" onclick="closeBooking()" aria-label="Close">✕</button>
      </div>
      <div class="progress-bar"><span id="progressBar" style="width:0%"></span></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

<div id="chrome-bottom"></div>
  <script src="js/galleries.js"></script>
  <script src="js/swipe.js"></script>
<script src="js/app.js" defer></script>
<script src="js/legacy-shim.js" defer></script>
</body>
</html>
