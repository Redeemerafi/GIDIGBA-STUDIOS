<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <title>Work Samples | GIDIGBA STUDIOS</title>
  <meta name="description" content="Before and after work samples from GIDIGBA STUDIOS. Choose women, men, children or couples." />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="js/chrome.js" defer></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-title="Work Samples | GIDIGBA STUDIOS" data-desc="Before and after work samples from GIDIGBA STUDIOS." data-page="samples">
<div id="chrome-top"></div>
<main id="main">

  <section class="page-hero">
    <div class="container">
      <a href="work.html" class="smp-back">&larr; Work</a>
      <span class="eyebrow" style="background:var(--lime);color:#000">Proof of work</span>
      <h1>Choose a set.</h1>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="sample-picker">

        <a class="sample-choice" href="samples-female.html">
          <span class="sc-frame">
            <img src="images/samples/f-01.webp" alt="Client finished in a beaded gold gown" loading="lazy" />
          </span>
          <span class="sc-name">Female</span>
        </a>

        <a class="sample-choice" href="samples-male.html">
          <span class="sc-frame">
            <img src="images/samples/m-01.webp" alt="Man in a light blue shirt, finished look" loading="lazy" />
          </span>
          <span class="sc-name">Male</span>
        </a>

        <div class="sample-choice is-empty">
          <span class="sc-frame">
            <span class="sc-soon">Coming soon</span>
          </span>
          <span class="sc-name">Child</span>
        </div>

        <div class="sample-choice is-empty">
          <span class="sc-frame">
            <span class="sc-soon">Coming soon</span>
          </span>
          <span class="sc-name">Couple</span>
        </div>

      </div>
    </div>
  </section>

  <section class="cta-band">
    <div class="container reveal">
      <h2 class="serif">Want your own?</h2>
      <a href="photoshoots.html" class="btn btn-primary">Start Photoshoot</a>
    </div>
  </section>

</main>
<div id="chrome-bottom"></div>
<script src="js/app.js" defer></script>
<script src="js/swipe.js"></script>
<script src="js/legacy-shim.js" defer></script>
</body>
</html>
